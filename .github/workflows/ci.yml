name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: lint, pruebas, cobertura y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # El script test:cov llega con la spec 001; desde entonces este paso exige
      # el 80 % de líneas. Antes de eso no hay pruebas que ejecutar.
      - name: Pruebas con cobertura (mínimo 80 % de líneas)
        run: npm run test:cov --if-present

      - name: Build
        run: npm run build
